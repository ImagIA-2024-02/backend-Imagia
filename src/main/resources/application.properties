spring.application.name=backend-Imagia

# Cambia la URL de la base de datos a tu base de datos local
spring.datasource.url=jdbc:mysql://localhost:3306/imagia-db

# Usuario y contraseña de tu base de datos local
spring.datasource.username=root
spring.datasource.password=170602

# El puerto del servidor sigue siendo el mismo
server.port=9090

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Mostrar las consultas SQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Habilitar Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html

# Formato y logging SQL
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Cambiar la estrategia de nomenclatura de tablas a snake_case si lo necesitas
spring.jpa.hibernate.naming.physical-strategy=com.acme.backendimagia.shared.intraestructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy
